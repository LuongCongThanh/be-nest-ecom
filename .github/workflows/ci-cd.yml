name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: Lint, test, build
    runs-on: ubuntu-latest
    # `npm run test` isn't pure unit tests — several specs (order-snapshot, product,
    # file-upload...) hit a real Postgres via Prisma and read config keys through
    # `ConfigService.getOrThrow`, the same way they do against the local .env in dev.
    # A service container + matching env vars here is what makes that pass in CI.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ecom_test
          POSTGRES_PASSWORD: ecom_test
          POSTGRES_DB: ecom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecom_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ecom_test:ecom_test@localhost:5432/ecom_test
      JWT_SECRET: ci-test-secret-not-used-anywhere-real
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN: 7d
      REDIS_URL: redis://localhost:6379
      CORS_ORIGINS: http://localhost:3000
      LOG_FORMAT: json
      LOG_LEVEL: error
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_ACCESS_KEY_ID: ci-test-key
      STORAGE_SECRET_ACCESS_KEY: ci-test-secret
      STORAGE_BUCKET: ci-test-bucket
      STORAGE_PUBLIC_URL: http://localhost:9000/ci-test-bucket
      STORAGE_REGION: auto
      STORAGE_FORCE_PATH_STYLE: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy

      # GitHub Actions `services:` containers can't override a service's command, and
      # minio/minio's default CMD needs `server /data` args to actually start the server
      # (see the same override in docker-compose.home.yml) — so MinIO runs as a plain
      # `docker run` step here instead, where the command is fully under our control.
      - name: Start MinIO for storage tests
        run: |
          docker run -d --name ci-minio -p 9000:9000 \
            -e MINIO_ROOT_USER=ci-test-key -e MINIO_ROOT_PASSWORD=ci-test-secret \
            minio/minio server /data
          for i in $(seq 1 20); do
            curl -sf http://localhost:9000/minio/health/live && break
            if [ "$i" = "20" ]; then echo "MinIO did not become ready in time" && exit 1; fi
            sleep 2
          done
          docker run --rm --network host \
            -e MC_HOST_local=http://ci-test-key:ci-test-secret@localhost:9000 \
            minio/mc mb --ignore-existing local/ci-test-bucket

      - run: npm run lint
      - run: npm run test
      - run: npm run build

  deploy:
    name: Deploy to home-server
    needs: ci
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    # Runs on a self-hosted runner installed on the home-server machine itself — that
    # machine has no public IP/inbound SSH (that's the whole reason it's behind ngrok),
    # so a GitHub-hosted runner can't reach it. The runner polls out to GitHub instead.
    runs-on: [self-hosted, home-server]
    concurrency:
      group: deploy-home-server
      cancel-in-progress: true
    defaults:
      run:
        shell: pwsh
    # Deploys from a dedicated clone (D:\my-doc\project\deploy-be-nest-ecom), separate
    # from any working copy used for day-to-day development on this same machine, so a
    # hard reset to origin/main here never touches uncommitted dev work elsewhere.
    env:
      DEPLOY_DIR: D:\my-doc\project\deploy-be-nest-ecom
    steps:
      - name: Pull latest main into the dedicated deploy clone
        run: |
          Set-Location $env:DEPLOY_DIR
          git fetch origin main
          git reset --hard origin/main

      # nginx/conf.d/app.conf is a one-time manual rename (docs/DEPLOYMENT-HOME.md step 5),
      # not a tracked file — `git reset --hard` above would otherwise restore the VPS-only
      # app.conf.example/bootstrap.conf and delete app.conf on every single deploy. Re-apply
      # it here so the home-server nginx config is idempotent across deploys.
      - name: Re-apply home-server nginx config
        run: |
          Set-Location $env:DEPLOY_DIR
          Copy-Item nginx\conf.d\app.home.conf.example nginx\conf.d\app.conf -Force
          Remove-Item nginx\conf.d\app.conf.example, nginx\conf.d\bootstrap.conf -ErrorAction SilentlyContinue

      - name: Rebuild and restart the app container
        run: |
          Set-Location $env:DEPLOY_DIR
          docker compose --env-file .env.production -f docker-compose.prod.yml -f docker-compose.home.yml up -d --build app

      - name: Wait for the app container to report healthy
        run: |
          $healthy = $false
          for ($i = 0; $i -lt 20; $i++) {
            $status = docker inspect --format='{{.State.Health.Status}}' ecom_app_prod 2>$null
            if ($status -eq "healthy") { $healthy = $true; break }
            Start-Sleep -Seconds 3
          }
          if (-not $healthy) {
            Set-Location $env:DEPLOY_DIR
            docker compose --env-file .env.production -f docker-compose.prod.yml -f docker-compose.home.yml logs --tail=100 app
            throw "app did not become healthy in time"
          }

      - name: Run pending database migrations
        run: |
          Set-Location $env:DEPLOY_DIR
          docker compose --env-file .env.production -f docker-compose.prod.yml -f docker-compose.home.yml exec -T app npx prisma migrate deploy
