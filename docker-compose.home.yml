# Overlay for self-hosting on a home PC behind DuckDNS, with self-hosted MinIO for storage
# (instead of Cloudflare R2). Combine with docker-compose.prod.yml — never used alone.
#
# Usage:
#   docker compose --env-file .env.production -f docker-compose.prod.yml -f docker-compose.home.yml up -d --build
#
# See docs/DEPLOYMENT-HOME.md.

services:
  minio:
    image: minio/minio:latest
    container_name: ecom_minio_prod
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_ACCESS_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5
    # No ports published to the host — only reachable by other containers on this
    # compose network. Public read access goes through nginx's /storage/ location.

  minio-init:
    image: minio/mc:latest
    container_name: ecom_minio_init_prod
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${STORAGE_ACCESS_KEY_ID} ${STORAGE_SECRET_ACCESS_KEY} &&
      mc mb --ignore-existing local/${STORAGE_BUCKET} &&
      mc anonymous set download local/${STORAGE_BUCKET}
      "
    restart: 'no'

  # Keeps the DuckDNS A record pointed at this machine's current public IP —
  # home ISPs rarely hand out a static one.
  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    container_name: ecom_duckdns
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
      - SUBDOMAINS=${DUCKDNS_SUBDOMAIN}
      - TOKEN=${DUCKDNS_TOKEN}
      - LOG_FILE=false

  # The app container calls STORAGE_ENDPOINT (https://<PUBLIC_DOMAIN>/storage) both to
  # relay uploads and to sign presigned URLs — the signature is only valid for that exact
  # host. This alias resolves the public domain to the nginx container *inside* the
  # compose network, so the app's own outbound calls to its public domain never leave the
  # machine (avoids relying on the home router supporting NAT hairpinning/loopback).
  nginx:
    depends_on: [app, minio]
    networks:
      default:
        aliases:
          - ${PUBLIC_DOMAIN}

networks:
  default:
    name: ecom_prod_network

volumes:
  miniodata:
