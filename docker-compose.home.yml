# Overlay for self-hosting on a home PC, published to the internet via an ngrok tunnel
# (no router port-forwarding, no dynamic DNS), with self-hosted MinIO for storage instead
# of Cloudflare R2. Combine with docker-compose.prod.yml — never used alone.
#
# Usage:
#   docker compose --env-file .env.production -f docker-compose.prod.yml -f docker-compose.home.yml up -d --build
#
# See docs/DEPLOYMENT-HOME.md.

services:
  minio:
    image: minio/minio:latest
    container_name: ecom_minio_prod
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_ACCESS_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5
    # No ports published to the host — only reachable by other containers on this
    # compose network. Public read access goes through nginx's /storage/ location.

  minio-init:
    image: minio/mc:latest
    container_name: ecom_minio_init_prod
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${STORAGE_ACCESS_KEY_ID} ${STORAGE_SECRET_ACCESS_KEY} &&
      mc mb --ignore-existing local/${STORAGE_BUCKET} &&
      mc anonymous set download local/${STORAGE_BUCKET}
      "
    restart: 'no'

  # Holds the outbound-only tunnel to ngrok's edge and forwards the reserved static
  # domain to nginx over the compose network. No router config needed — nginx never
  # needs a port published to the host for this path to work.
  ngrok:
    image: ngrok/ngrok:latest
    container_name: ecom_ngrok
    restart: unless-stopped
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command:
      - http
      - --url=${NGROK_DOMAIN}
      - nginx:80
    depends_on:
      - nginx

  # ngrok terminates TLS at its own edge, so nginx only needs to serve plain HTTP —
  # no certbot, no cert renewal, no bootstrap/app two-step here.
  nginx:
    depends_on: [app, minio]

networks:
  default:
    name: ecom_prod_network

volumes:
  miniodata:
